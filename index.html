<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>چسوكتي ❤️ رحلة حب في الكون</title>
  <meta name="description" content="تجربة سينمائية رومانسية فاخرة مهداة إلى چسوكتي." />

  <!-- Fonts: Arabic luxury typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- WebGL Canvas (Three.js mounts here) -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Vignette overlay for cinematic depth -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Loading screen -->
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-star"></div>
    <p class="loader-text">يتم تجهيز الكون...</p>
  </div>

  <!-- Skip / intro hint -->
  <button id="start-btn" class="start-btn" type="button">
    <span>ابدأ التجربة</span>
  </button>

  <!-- Scene 3 — Arabic poetic text -->
  <div id="scene-text" class="scene-text" aria-hidden="true">
    <p>إلى أجمل فتاة في عالمي</p>
  </div>

  <!-- Scene 5/6 — Name reveal -->
  <div id="name-reveal" class="name-reveal" aria-hidden="true">
    <h1 class="name">چسوكتي</h1>
    <div class="name-sparkles"></div>
  </div>

  <!-- Scene 7 — Romantic quote -->
  <div id="quote" class="quote" aria-hidden="true">
    <p>
      من بين مليارات النجوم،<br />
      اختار قلبي أن يدور حولكِ أنتِ.
    </p>
  </div>

  <!-- Scene 8 — Interactive button -->
  <div id="cta-wrap" class="cta-wrap" aria-hidden="true">
    <button id="open-letter" class="cta" type="button">
      <span class="cta-shine"></span>
      <span class="cta-text">رسالة خاصة</span>
    </button>
  </div>

  <!-- Scene 9 — Final caption -->
  <div id="final-line" class="final-line" aria-hidden="true">
    <p>أحبكِ يا چسوكتي ❤️</p>
  </div>

  <!-- Modal letter -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="document">
      <button class="modal-close" type="button" data-close aria-label="إغلاق">×</button>
      <h2 id="modal-title" class="modal-title">چسوكتي ❤️</h2>
      <p class="modal-body">
        أنتِ أجمل صدفة،<br />
        وأجمل اختيار،<br />
        وأجمل قصة أعيشها كل يوم.
      </p>
      <div class="modal-glow" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Music toggle -->
  <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" aria-label="تشغيل الموسيقى">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </button>

  <audio id="bg-music" src="assets/audio/music.mp3" loop preload="none"></audio>

  <!-- Three.js + GSAP via CDN (ESM) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
